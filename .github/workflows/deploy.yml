name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" manual
  schedule:
    - cron: '0 9 * * *' # 06:00 de Brasília: publica artigos agendados (date futura)

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Instala (npm ci) e roda `npm run build` (astro check + astro build).
      # Se o build falhar (ex.: frontmatter inválido), o job `deploy` não roda e o site atual continua no ar.
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
